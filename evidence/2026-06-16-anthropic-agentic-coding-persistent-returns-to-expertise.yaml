source:
  title: "Agentic coding and persistent returns to expertise"
  producer: "Anthropic"
  producer_type: organization
  date: "2026-06-16"
  url: "https://www.anthropic.com/research/claude-code-expertise"
  type: report
  provenance: primary
presentation:
  headline: "Human expertise stays load-bearing while the agent executes"
  summary: "Across approximately 400,000 interactive Claude Code sessions, Anthropic reports that experienced users trigger more agent activity and reach higher verified-success rates, suggesting human expertise remains a productive system input as well as a scaling constraint."
observed:
  - "Anthropic analyzed approximately 400,000 interactive Claude Code sessions from approximately 235,000 users between October 2025 and April 2026, using privacy-preserving classifiers built on Claude Sonnet 4.6."
  - "Users make approximately 70% of planning decisions and Claude makes approximately 80% of execution decisions. A typical session runs about four turns, each prompt triggers about 10 Claude actions and occasionally more than 100."
  - "Novice sessions average about 5 Claude actions and 600 words per prompt while expert sessions average about 12 actions and 3,200 words. Anthropic reports the difference at p<0.001."
  - "Verified success is 15% for novices and 28-33% for intermediate and expert users. At least partial success is 77% versus 91-92%. Novices abandon troubled sessions at 19% against 5-7% for intermediate through expert users."
  - "Domain knowledge matters more than coding background: non-software occupations reach 29% verified success on coding sessions against 34% for software occupations."
  - "Between October 2025 and April 2026 debugging fell from 33% to 19% of work, operating software rose from 14% to 21%, writing and analysis roughly doubled, and estimated value of the average session rose 27%."
  - "Anthropic excludes headless sessions and states that it cannot measure whether code written in a session is actually used or discarded thereafter, that classifiers remain challenging to validate at scale, and that task value estimates are coarse."
scale:
  label: "Scale signal"
  summary: "Approximately 400,000 interactive sessions from approximately 235,000 users over seven months. The unit of observation is a single human-steered session; headless and programmatic usage is excluded and no concurrency figure is reported."
mapping:
  stages: [Apparition, Selection]
  conditions: [Context, Execution, Verification, Observability]
claims:
  - {id: C01, relationship: SUPPORTS}
  - {id: C02, relationship: REFINES}
interpretation: "Apparition is documented at scale rather than asserted. The Selection content is that the variable separating useful outcomes from abandoned ones is the quality of human direction rather than the agent, and that this gradient did not decay across seven months of model change. Much of the context the agent needs still arrives through the operator, and the verification signal the study itself relies on is git and test evidence."
model_implication:
  verdict: "REFINES"
  explanation: "The model places human attention in the denominator of agentic-system fitness, as a cost to be reduced. This evidence is consistent with human expertise also acting as an input that raises useful outcome. It also refines the Context condition, since a substantial share of the knowledge an agent uses is supplied by the operator rather than acquired by the agent."
what_this_does_not_establish:
  - "The source is Anthropic's own study of its own product and does not independently validate its usage, success, or value claims."
  - "It observes interactive sessions only; headless and programmatic usage is excluded."
  - "It reports no concurrency measurement and establishes nothing about parallel agents, agent fleets, or 1K-agent scale."
  - "The expertise gradient is correlational."
  - "Verified success is a lower bound rather than a success rate."
  - "Expertise and occupation are classifier-inferred and about 30% of sessions lack a classifiable occupation signal."
  - "Task value is coarse and not intended for literal dollar interpretation."
  - "It does not establish the model's proposed evolutionary sequence."
open_question: "Does the returns-to-expertise gradient survive concurrency? The measured unit is one person steering one agent, so the decisive next observation is whether expert direction still lifts outcomes when a single person supervises many concurrent or headless agents."
practice_assessment:
  status: assessed
assessment:
  assisted_by_ai: true
