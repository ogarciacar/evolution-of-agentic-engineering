    use_case: "Execute several software-engineering tasks without serially occupying one foreground coding session."
    problem: "A single interactive agent session limits how much independent engineering work can proceed at once."
    reported_practice: "Run multiple coding agents in parallel, with each agent operating in its own remote environment."
    selection_conditions: [execution, coordination]
  - id: observable-agent-followup-and-takeover
    use_case: "Keep humans in control of remotely executing coding-agent tasks."
    problem: "A long-running remote task needs supervision and a way to recover when the agent needs correction or human intervention."
    reported_practice: "Expose per-agent status and allow the user to send follow-up instructions or take over execution at any point."
    selection_conditions: [observability, coordination]
  - id: background-agent-pr-drafting
    use_case: "Delegate bounded engineering work that can return as a reviewable artifact."
    problem: "Investigations, small fixes, and medium-sized changes consume developer attention even when the work can be performed asynchronously."
    reported_practice: "Use background agents for small fixes, investigations, and first drafts of medium-sized pull requests."
    selection_conditions: [execution]

