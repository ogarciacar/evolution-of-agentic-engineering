  type: engineering-blog
  provenance: primary

presentation:
  headline: "Specialized coordination turns swarm activity into useful progress"
  summary: "Cursor reports that a redesigned agent swarm outperformed its earlier swarm across every tested model configuration on the same SQLite implementation task, while reducing coordination failures and separating planning from execution into differentiated agent roles."

observed:
  - "Cursor reports running its old and new agent swarms on the same task, with the same models and the same time budget, measuring the fraction of a held-out SQL test suite passed; the new swarm performed better in every tested model configuration."
  - "Cursor reports that with Grok 4.5 the new swarm reached 80% of the held-out suite in four hours, while the old swarm was paused before its second hour after becoming unstable."
  - "The new swarm uses planner agents to decompose goals and delegate work and worker agents to execute bounded pieces; Cursor reports that planners do not implement and workers do not plan so that each role can use its context for a narrower purpose."
  - "Cursor reports that the old Grok 4.5 run accumulated more than 70,000 merge conflicts before it was paused, while the new run logged fewer than 1,000 over four hours."
  - "Cursor describes additional differentiated coordination and verification mechanisms including reconciler agents for conflicting design decisions, neutral third-party agents for merge conflicts, outside agents for decomposing overgrown files, and stacked review agents using different review lenses."
  - "Cursor reports that its earlier browser swarm peaked at roughly 1,000 commits per hour on Git, while the newer system can peak around 1,000 commits per second and therefore uses a purpose-built version control system for agent-scale coordination."
  - "Across the tested SQLite runs, Cursor reports similar quality across model mixes but large cost differences: total reported costs ranged from $1,339 for an Opus 4.8 planner with Composer 2.5 workers to $10,565 for GPT-5.5 used for both planning and work."

scale:
  label: "Scale signal"
  summary: >
    The redesigned swarm is reported to peak around 1,000 commits per second. In the
    controlled Grok 4.5 SQLite comparison, the old swarm accumulated more than 70,000
    merge conflicts before being paused, while the new swarm logged fewer than 1,000
    over four hours and reached 80% of the held-out suite.

