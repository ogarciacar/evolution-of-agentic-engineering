source:
  title: "DynamicMCPBench: A Trace-Grounded, Effect-Scored Benchmark for LLM Agents over Live MCP Servers"
  producer: "Kamiński et al."
  producer_type: authors
  date: "2026-07-10"
  url: "https://aclanthology.org/2026.emnlp-industry.202/"
  type: paper
  provenance: primary

presentation:
  headline: "Reliable tool use collapses as agents traverse longer live-service chains"
  summary: >
    DynamicMCPBench evaluates 24 models over 121 MCP servers and 750 tasks by
    verifying observable effects rather than final text or one prescribed tool
    sequence. A task counts as solved only when all three attempts succeed. The
    strongest agents reliably solve only about half the tasks, 31% are solved by
    no model, and accuracy falls from 39% on short chains to 13% on long chains.

observed:
  - "The evaluation covers 24 models, 121 live MCP servers, and 750 tasks balanced across 15 tool-use categories."
  - "The released corpus contains 1,845 task specifications and 2,051 successful reference traces; the paper evaluates a balanced 750-task slice."
  - "Tasks are generated by pursuing goals against live servers, recording successful traces, and distilling them into path-agnostic effect checkpoints."
  - "Required effects can include equivalent tool calls, produced values, forbidden minefield actions, and partial ordering only where steps genuinely depend on one another."
  - "Candidates replay against the recorded world so models face the same server responses while being free to use different valid action paths."
  - "A task uses pass-cubed scoring and counts as solved only when all three independent attempts satisfy its effects."
  - "The strongest evaluated agents reliably solve only about half of the tasks, while 31% of tasks are solved by no model."
  - "Accuracy falls from 39% on the shortest reference chains to 13% on the longest chains."
  - "The corpus includes 891 short tasks with one or two calls, 427 medium tasks with three or four calls, and 527 long tasks with at least five calls."
  - "A human validation study reports chance-corrected agreement of 0.76 with the automatic effect scorer."
  - "The framework can be rerun against a practitioner's own MCP servers and tasks rather than remaining a fixed static dataset."

scale:
  label: "Evidence boundary"
  summary: >
    The paper evaluates 24 models on a balanced 750-task slice over 121 servers,
    with three attempts per task and human scorer validation. Tasks are generated
    from successful machine-produced traces and executed through deterministic
    replay, so results measure controlled benchmark reliability rather than live
    production incident or business-outcome rates.

mapping:
  stages: [Selection]
  conditions: [Context, Execution, Verification, Coordination, Observability]

claims:
  - id: C02
    relationship: REFINES

interpretation: >
  DynamicMCPBench refines Selection in two ways. First, agent success should be
  verified through intended external state and prohibited effects, not agreement
  with one textual answer or tool trace. Second, occasional success is not
  reliable capability: requiring three successful attempts reveals substantial
  instability, which worsens as dependent tool chains lengthen. Cross-service
  execution therefore makes effect verification, ordering, recovery, and repeated
  success part of the fitness function.

model_implication:
  verdict: "REFINES"
  explanation: >
    Refines C02 by showing that execution fitness depends on reproducibly reaching
    the intended state through an allowed path. The fall from 39% to 13% across
    chain lengths makes long-horizon tool coordination a measurable selection
    pressure, while effect scoring avoids penalizing alternative valid strategies.

what_this_does_not_establish:
  - "The benchmark uses generated goals and successful reference traces rather than a representative sample of production user requests."
  - "Deterministic replay improves comparability but does not reproduce every live-server race, outage, permission change, or evolving state."
  - "Reference-chain length is a useful complexity proxy but does not isolate causality from task category, ambiguity, server scope, or model familiarity."
  - "Pass-cubed is a strict reliability definition; production systems may use retries, human intervention, compensation, or different success thresholds."
  - "Automatic scoring has substantial human agreement but is not perfect and may miss semantically valid or harmful effects outside its checkpoints."
  - "The strongest-agent result depends on the evaluated model set, prompts, tool schemas, and 2026 versions."
  - "Controlled task success does not establish production safety, cost effectiveness, user value, or organizational productivity."
  - "The study evaluates individual agents using services, not cooperation among persistent engineering agents or specialized higher-order objects."

open_question: >
  Which planning, state-tracking, recovery, and verification mechanisms preserve
  reliable intended effects as agent workflows span more dependent tools and
  independently evolving services?

practice_assessment:
  status: assessed
practice_observations:
  - id: verify-agent-effects-not-tool-traces
    use_case: "Evaluate an agent that may solve a service task through several valid tool paths."
    problem: "Exact tool-sequence and final-text matching reject valid alternatives and can accept answers that never changed the external system."
    reported_practice: "Distill successful traces into required effects, equivalent actions, forbidden minefields, and only necessary ordering constraints."
    selection_conditions: [verification, execution]
  - id: require-repeated-agent-task-success
    use_case: "Decide whether an agent can reliably own a multi-service workflow."
    problem: "A single successful run hides stochastic failures that make autonomous operation unreliable."
    reported_practice: "Run independent attempts and count the task as reliably solved only when every required attempt reproduces the intended effects."
    selection_conditions: [verification, observability]
  - id: stratify-tool-evaluation-by-chain-length
    use_case: "Locate where an agent workflow loses reliability as dependencies increase."
    problem: "Aggregate success rates hide sharp degradation on long, dependent action chains."
    reported_practice: "Group tasks by required chain depth and report reliability separately for short, medium, and long workflows."
    selection_conditions: [execution, coordination, observability]
  - id: replay-live-tool-worlds-deterministically
    use_case: "Compare agents against tasks originally generated from live, stateful services."
    problem: "Changing server data makes model comparisons irreproducible while static mocks lose realistic tool effects."
    reported_practice: "Record successful live traces and replay canonical tool calls and results so each candidate faces the same stateful world."
    selection_conditions: [context, verification, observability]

assessment:
  assisted_by_ai: true
