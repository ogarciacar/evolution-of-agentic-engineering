source:
  title: "An Organizational Second Brain: Building an AI That Learns From Experts"
  producer: "Meta"
  producer_type: organization
  date: "2026-09-02"
  url: "https://engineering.fb.com/2026/09/02/ml-applications/organizational-second-brain-ai-learns-from-experts/"
  type: engineering-blog
  provenance: primary

presentation:
  headline: "Expert corrections become regression-tested institutional memory"
  summary: >
    Meta describes an integrated agent system that separates structured knowledge
    from reasoning procedures, then converts expert corrections into minimal,
    reviewed, regression-tested file changes without retraining the model. After
    six weeks, Meta reports assessment time falling from days to minutes and zero
    regressions across improvement cycles.

observed:
  - >
    Meta built a domain-specific agent with four interdependent layers: a
    structured knowledge system, composable reasoning procedures, an evaluation
    framework, and a self-improvement loop.
  - >
    The knowledge system contains more than 200 structured files with explicit
    boundaries, routing rules, dependencies, and consumers; Meta separates
    frequently used distilled knowledge from sparse sources retrieved when needed.
  - >
    Meta reports that replacing a flat instruction file and broad semantic
    retrieval with recipe-driven progressive disclosure reduced tokens consumed
    per turn by around 80%.
  - >
    Human checkpoints and escalations let experts confirm, correct, or redirect
    intermediate reasoning, and each correction becomes input to the improvement
    loop.
  - >
    The improvement pipeline diagnoses feedback, compiles minimal file edits,
    performs independent adversarial review and deterministic structural checks,
    runs targeted replay and regression tests, and presents a pull request to a
    domain expert for final review.
  - >
    When a fix lands, the triggering failure and validated answer are added to the
    regression suite so future changes must preserve the corrected behavior.
  - >
    After three development sprints spanning six weeks, Meta reports reducing
    individual assessment time from days to minutes, producing validated knowledge
    edits at a rate that previously required full engineering sprints, and
    observing zero regressions across improvement cycles.

scale:
  label: "Scale signal"
  summary: >
    The implemented system structures more than 200 interdependent knowledge
    files and was evaluated over three development sprints spanning six weeks.
    Meta reports around 80% fewer tokens per turn after progressive-disclosure
    restructuring, days-to-minutes assessment time, and zero regressions across
    its improvement cycles.

