source:
  title: "The AI engineering stack we built internally — on the platform we ship"
  producer: "Cloudflare"
  producer_type: organization
  date: "2026-04-20"
  url: "https://blog.cloudflare.com/internal-ai-engineering-stack/"
  type: engineering-blog
  provenance: primary

presentation:
  headline: "The engineering environment becomes an integrated agentic system"
  summary: >
    Cloudflare reports 3,683 active internal AI-tool users, 93% R&D adoption,
    295 teams using agentic AI tools, and 47.95 million AI requests in 30 days.
    Its internal stack integrates platform routing and permissions, Backstage and
    repository context, Engineering Codex standards, and multi-agent code review.
    Cloudflare says the wiring between these layers now makes an agent's first
    draft usually close enough to ship, which it says was not true six months earlier.

observed:
  - >
    Cloudflare reports 3,683 internal users actively using AI coding tools, equal
    to 60% of the company and 93% of R&D, across 295 teams. In the reported
    30-day period it records 47.95 million AI requests, 20.18 million AI Gateway
    requests, 241.37 billion tokens routed through AI Gateway, and 51.83 billion
    tokens processed on Workers AI.
  - >
    Cloudflare organizes the internal stack into a platform layer for authentication,
    routing and inference; a knowledge layer built around Backstage and AGENTS.md;
    and an enforcement layer built around the AI Code Reviewer and Engineering Codex.
  - >
    Cloudflare says a single proxy Worker became the control point for AI access,
    allowing per-user attribution, model-catalog management and permission enforcement
    without changing client configurations.
  - >
    Cloudflare's AGENTS.md generation pipeline combines Backstage ownership,
    dependency and system metadata with repository analysis and Engineering Codex
    standards, then opens a merge request for the owning team. Cloudflare reports
    roughly 3,900 repositories processed this way and says the AI Code Reviewer can
    flag when repository changes suggest that AGENTS.md should be updated.
  - >
    Every merge request on Cloudflare's standard CI path receives AI review. A
    multi-agent coordinator classifies each change by risk tier and delegates to
    specialized agents for code quality, security, Codex compliance, documentation,
    performance and release impact. Cloudflare reports 100% reviewer coverage across
    repositories on that standard CI pipeline in the measured period.
  - >
    Review agents use centralized model configuration, repository AGENTS.md context,
    and Engineering Codex rules. Findings are returned as structured merge-request
    comments with severity and, where applicable, specific Codex rule identifiers.
  - >
    Cloudflare reports that its Network Firewall team used a multi-agent consensus
    process to audit rampartd against Engineering Codex requirements, turning work it
    says previously required weeks of manual effort into a structured repeatable process.
  - >
    Cloudflare states that the individual pieces are not especially novel; the
    difference is their wiring. When agents can combine Backstage context, repository
    instructions and Codex-based review in the same toolchain, Cloudflare says the
    first draft is usually close enough to ship, unlike six months earlier.
  - >
    Cloudflare also uses workload-aware model routing for economics. Workers AI handles
    about 15% of AI Code Reviewer traffic, mainly documentation review, while more
    capable frontier models are used for security-sensitive and architecturally complex
    reviews. Cloudflare separately reports a security-agent workload processing more
    than 7 billion tokens per day on Workers AI at an estimated 77% lower cost than a
    mid-tier proprietary-model alternative.

