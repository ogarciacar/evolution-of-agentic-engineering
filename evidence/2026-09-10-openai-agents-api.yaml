presentation:
  headline: "Orchestration becomes infrastructure for long-running parallel agents"
  summary: >
    OpenAI packages the harness and infrastructure behind Codex as a managed API
    for long-running agents, with context management, tool use, durable execution,
    and subagent coordination as distinct platform capabilities. One customer
    reports that moving to the API's subagent support improved its evaluation
    score from 0.71 to 0.85 and reduced latency by 4x compared with its prior
    orchestration setup.

observed:
  - >
    OpenAI says useful long-running agents need a harness that manages context,
    uses tools efficiently, coordinates subagents, preserves intermediate work,
    and keeps execution reliable for days.
  - >
    The Agents API separates the managed Codex harness from the agent's compute
    environment, which may be an OpenAI-hosted sandbox, customer infrastructure,
    or an integrated sandbox provider.
  - >
    OpenAI reports that the harness compacts earlier context for sessions spanning
    multiple context windows, loads relevant tool definitions on demand, and lets
    agents run tool calls in parallel or combine results before returning relevant
    information to model context.
  - >
    OpenAI reports that multi-agent support delegates independent work to parallel
    subagents with separate contexts while a main agent coordinates and combines
    their results.
  - >
    Ciridae reports that after adopting the Agents API its evaluation score rose
    from 0.71 to 0.85 and its previous difficulty observing and orchestrating
    subagents was reduced, with a 4x latency improvement.
  - >
    Customer reports published by OpenAI include asynchronous fan-out across
    hundreds of agents and thousands of long-running agents coordinating work
    across production logistics workflows lasting hours or days.

scale:
  label: "Scale signal"
  summary: >
    OpenAI presents the managed harness as derived from operating Codex and
    ChatGPT for Work at millions-of-users scale. Customer reports include fan-out
    across hundreds of agents and thousands of long-running production agents;
    one customer reports a 4x latency reduction and evaluation improvement from
    0.71 to 0.85 after adopting the API's subagent support.

