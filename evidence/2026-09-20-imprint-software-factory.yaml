source:
  title: "Trying the Software factory pattern"
  producer: "Will Larson"
  producer_type: individual
  date: "2026-09-20"
  url: "https://lethain.com/software-factory-experiment/"
  type: engineering-blog
  provenance: primary

presentation:
  headline: "The project becomes a goal-regulated agentic engineering loop"
  summary: >
    Will Larson describes an early Imprint experiment that points an agent at a
    project rather than a single task. The loop audits whether goals and measures
    exist, reads current metrics and work state, creates or updates tasks,
    executes non-blocked work, and periodically reassesses direction. Larson says
    the local prototype is working well enough to consider moving it to Imprint's
    orchestrated Agent Fleet, but publishes no outcome comparison.

observed:
  - >
    Larson defines the software-factory pattern as repeatedly pursuing a broad
    goal while relying on an agent harness to drive progress toward it.
  - >
    Imprint's first implementation is a linear-project-loop skill that begins by
    auditing whether a Linear project has an RFC in Notion describing its goals,
    measures, and approach, together with a Datadog dashboard or Snowflake
    queries that measure progress.
  - >
    When the project, goal definition, or measurement tools are missing, the
    skill iterates with the operator to create them.
  - >
    The loop reviews project metrics and issues, adds newly identified work,
    updates issue state, and works on non-blocked tasks through actions such as
    writing or updating pull requests, requesting review, and asking clarifying
    questions.
  - >
    After a task completes, the loop selects another task when the project
    description is fresh; when it is stale, the agent restarts from the goal and
    measurement audit.
  - >
    Larson reports running the prototype locally and says it works well enough
    that he anticipates moving it to the same orchestrated harness used for
    one-off tasks.
  - >
    Larson describes a possible lower-frequency post-release mode that would
    revisit shipped projects and detect changes in adoption or error rates, but
    presents this as an intended use rather than a demonstrated result.
  - >
    Imprint's preceding adoption sequence included about ten local multi-repository
    workspaces, a company-wide migration from Jira to Linear, and deployment of
    an orchestrated harness called Agent Fleet.
  - >
    Larson says the factory loop depends on Datadog MCP and Snowflake access for
    goal tracking, Linear as the shared work-state system, and a harness capable
    of operating independently from a developer laptop.

scale:
  label: "Evidence boundary"
  summary: >
    This is a first-pass local experiment at Imprint. The source mentions about
    ten multi-repository workspaces and an existing orchestrated Agent Fleet, but
    does not report how many projects or tasks ran through the factory loop, how
    long it operated, or any comparative quality, productivity, cost, or human-
    attention outcomes.

