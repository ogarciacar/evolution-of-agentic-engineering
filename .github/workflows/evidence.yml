name: Evidence integrity

on:
  pull_request:
  push:
    branches: [main]

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate evidence records
        run: python scripts/validate-evidence.py
      - name: Check publication safety
        run: python scripts/check-publication-safety.py
      - name: Check evidence projection schema
        run: python scripts/check-evidence-projection.py
      - name: Check canonical corpus projection
        run: python scripts/test-evidence-projection.py
      - name: Build evidence page
        run: python scripts/build-evidence.py
      - name: Build homepage evidence
        run: python scripts/build-homepage-evidence.py
      - name: Upload generated evidence pages
        uses: actions/upload-artifact@v7
        with:
          name: generated-evidence-pages
          path: |
            evidence.html
            signals/*/index.html
            index.html
            sitemap.xml
      - name: Verify generated artifacts are committed
        run: |
          git diff --exit-code -- evidence.html index.html sitemap.xml signals
          test -z "$(git status --porcelain --untracked-files=all -- 'signals/*/index.html')"
