name: Evidence integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  evidence:
    name: Evidence integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt
      - name: Test preview smoke helpers
        run: python -m unittest pipeline.preview.test_preview_smoke
      - name: Test preview change scope
        run: python -m unittest pipeline.preview.test_change_scope
      - name: Test browser E2E runner
        run: python -m unittest pipeline.browser.test_run_preview_e2e
      - name: Validate model claims
        run: python pipeline/validation/validate-model-claims.py
      - name: Validate research gaps
        run: python pipeline/validation/validate-research-gaps.py
      - name: Validate research synthesis
        run: python pipeline/validation/validate-synthesis.py
      - name: Validate evidence records
        run: python pipeline/validation/validate-evidence.py
      - name: Check practice assessment completeness
        run: python pipeline/validation/check-practice-assessment-completeness.py
      - name: Test practice assessment completeness
        run: python pipeline/validation/test-practice-assessment-completeness.py
      - name: Check atomic evidence contribution contract
        if: github.event_name == 'pull_request'
        run: python pipeline/validation/check-atomic-evidence-contribution.py
      - name: Validate evidence claim mappings
        run: python pipeline/validation/validate-evidence-claims.py
      - name: Check model claim evaluation
        run: python pipeline/validation/check-model-evaluation.py
      - name: Check synthesis drift
        run: python pipeline/validation/check-synthesis-drift.py
      - name: Check publication safety
        run: python pipeline/validation/check-publication-safety.py
      - name: Check evidence projection schema
        run: python pipeline/projection/check-evidence-projection.py
      - name: Check canonical corpus projection
        run: python pipeline/projection/test-evidence-projection.py
      - name: Check evidence claim projection
        run: python pipeline/projection/check-evidence-claims-projection.py
      - name: Check deterministic evidence indexer
        run: python pipeline/projection/check-evidence-indexer.py
      - name: Check D1 synchronization export
        run: python pipeline/projection/check-evidence-sync.py
      - name: Check shared evidence read model
        run: node pipeline/projection/check-evidence-read-model.mjs
      - name: Check practice observation read model
        run: node pipeline/projection/check-practice-observation-read-model.mjs
      - name: Check Practice Observations rendering
        run: node pipeline/projection/check-practice-observations-render.mjs
      - name: Check Practice Observations navigation
        run: node pipeline/projection/check-practice-navigation.mjs
      - name: Check Practice Observations integration
        run: node pipeline/projection/check-practice-observations-integration.mjs
      - name: Generate derived artifacts
        run: python pipeline/build-derived-artifacts.py
      - name: Upload generated evidence artifacts
        uses: actions/upload-artifact@v7
        with:
          name: generated-evidence-artifacts
          path: |
            research-frontier.json
            evaluate.html
            synthesis.html
            sitemap.xml
      - name: Verify derived artifacts are committed
        run: git diff --exit-code -- research-frontier.json evaluate.html sitemap.xml synthesis.html
      - name: Check research frontier
        run: python pipeline/validation/check-research-frontier.py
