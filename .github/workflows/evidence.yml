name: Evidence integrity

on:
  pull_request:
  push:
    branches: [main]

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build evidence page
        run: python scripts/build-evidence.py
      - name: Verify generated artifact is committed
        run: git diff --exit-code -- evidence.html
