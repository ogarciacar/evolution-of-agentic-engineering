name: Evidence integrity

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate model claims
        run: python scripts/validate-model-claims.py
      - name: Validate research gaps
        run: python scripts/validate-research-gaps.py
      - name: Validate research synthesis
        run: python scripts/validate-synthesis.py
      - name: Validate evidence records
        run: python scripts/validate-evidence.py
      - name: Validate evidence claim mappings
        run: python scripts/validate-evidence-claims.py
      - name: Check model claim evaluation
        run: python scripts/check-model-evaluation.py
      - name: Check synthesis drift
        run: python scripts/check-synthesis-drift.py
      - name: Check publication safety
        run: python scripts/check-publication-safety.py
      - name: Check evidence projection schema
        run: python scripts/check-evidence-projection.py
      - name: Check canonical corpus projection
        run: python scripts/test-evidence-projection.py
      - name: Check evidence claim projection
        run: python scripts/check-evidence-claims-projection.py
      - name: Check deterministic evidence indexer
        run: python scripts/check-evidence-indexer.py
      - name: Check D1 synchronization export
        run: python scripts/check-evidence-sync.py
      - name: Generate derived artifacts
        run: python scripts/build-derived-artifacts.py
      - name: Check research frontier
        run: python scripts/check-research-frontier.py
      - name: Verify generated artifacts are clean
        run: |
          git diff --exit-code -- research-frontier.json evidence.html evaluate.html index.html sitemap.xml synthesis.html signals
          test -z "$(git status --porcelain --untracked-files=all -- 'signals/*/index.html')"
      - name: Upload generated evidence pages
        uses: actions/upload-artifact@v7
        with:
          name: generated-evidence-pages
          path: |
            evidence.html
            evaluate.html
            synthesis.html
            signals/*/index.html
            index.html
            sitemap.xml
