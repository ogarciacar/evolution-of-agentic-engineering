name: Regenerate PR 17 evidence

on:
  push:
    branches: [test-observed-evidence-layout]

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: test-observed-evidence-layout
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/validate-evidence.py
      - run: python scripts/build-evidence.py
      - name: Commit generated evidence
        run: |
          if git diff --quiet -- evidence.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence.html
          git commit -m "Regenerate evidence page"
          git push origin HEAD:test-observed-evidence-layout
