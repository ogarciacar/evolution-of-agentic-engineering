name: Preview browser E2E

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-browser-e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser:
    name: Preview browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: evolution-of-agentic-engineering
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PREVIEW_E2E_TIMEOUT_SECONDS: "600"

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine deployed preview relevance
        id: scope
        run: python pipeline/preview/change_scope.py

      - uses: actions/setup-python@v7
        if: steps.scope.outputs.relevant == 'true'
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v6
        if: steps.scope.outputs.relevant == 'true'
        with:
          node-version: "24"

      - name: Resolve deployed preview context
        if: steps.scope.outputs.relevant == 'true'
        run: python pipeline/browser/resolve_preview_context.py

      - name: Install Playwright
        if: steps.scope.outputs.relevant == 'true'
        run: npm install --no-save --package-lock=false @playwright/test@1.62.1

      - name: Install Chromium
        if: steps.scope.outputs.relevant == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run projected reader journey
        if: steps.scope.outputs.relevant == 'true'
        run: npx playwright test --config pipeline/browser/playwright.config.mjs

      - name: Deployed preview not applicable
        if: steps.scope.outputs.relevant == 'false'
        run: echo "No publication, projection, or deployed-acceptance files changed; browser E2E is not applicable."

      - name: Upload browser diagnostics
        if: ${{ !cancelled() && steps.scope.outputs.relevant == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: preview-browser-e2e-${{ github.event.pull_request.head.sha }}
          path: |
            playwright-report/
            test-results/browser-e2e/
          if-no-files-found: ignore
          retention-days: 14
