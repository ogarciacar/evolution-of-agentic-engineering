name: Remove homepage sections
on: push
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: homepage-refinements-v0-2
          token: ${{ github.token }}
      - name: Remove recursion and falsifiability sections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text()
          patterns = [
            r'<section><div class="eyebrow">Potential recursion</div><h2>Specialization may create the next object</h2>.*?</section>\n?',
            r'<section><div class="eyebrow">Falsifiability</div><h2>What would challenge the model\?</h2>.*?</section>\n?',
          ]
          for pattern in patterns:
              s, n = re.subn(pattern, '', s, count=1, flags=re.S)
              if n != 1:
                  raise SystemExit(f'Expected section not found: {pattern}')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Remove recursion and falsifiability from homepage'
          git push origin HEAD:homepage-refinements-v0-2
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/remove-homepage-sections.yml
          git commit -m 'Remove temporary homepage cleanup workflow'
          git push origin HEAD:homepage-refinements-v0-2
