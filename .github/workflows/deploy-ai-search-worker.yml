name: Production · AI Search Worker deploy

on:
  push:
    branches: [main]
    paths:
      - "workers/ai-search/**"
      - "functions/_lib/evidence-read-model.js"
      - ".github/workflows/deploy-ai-search-worker.yml"
  workflow_dispatch:

concurrency:
  group: ai-search-worker-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      EVIDENCE_DB_NAME: ${{ vars.EVIDENCE_DB_NAME }}
      EVIDENCE_DB_ID: ${{ vars.EVIDENCE_DB_ID }}
      EAE_ANSWER_ENABLED: ${{ vars.EAE_ANSWER_ENABLED || 'true' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install locked test dependencies
        run: npm ci

      - name: Check evidence packages in Workers runtime
        run: npm run test:worker

      - name: Check AI Search Worker contract
        run: node workers/ai-search/check-search-endpoint.mjs

      - name: Bind the existing production evidence database
        run: node workers/ai-search/configure-deploy.mjs

      - name: Deploy AI Search Worker
        run: npx --yes wrangler@4 deploy --config workers/ai-search/wrangler.deploy.json

      - name: Verify production search endpoint
        shell: bash
        run: |
          set -euo pipefail

          curl --fail-with-body \
            --silent \
            --show-error \
            --retry 5 \
            --retry-all-errors \
            --retry-delay 3 \
            --header 'Accept: application/json' \
            'https://agenticengineering.science/api/search?q=Spotify&passages=1' \
            --output response.json

          python - <<'PY'
          import json
          from urllib.parse import urlparse

          with open("response.json", encoding="utf-8") as f:
              data = json.load(f)

          assert data.get("query") == "Spotify"
          results = data.get("results")
          assert isinstance(results, list)

          for result in results:
              path = urlparse(result["url"]).path.rstrip("/")
              assert path == "/practices" or path.startswith("/signals/"), path

          evidence = data.get("evidence")
          assert isinstance(evidence, dict), "Missing opt-in evidence package"
          assert evidence.get("version") == 1
          assert evidence.get("outcome") in ("evidence_found", "no_matching_evidence")
          for source in evidence.get("sources", []):
              assert source["id"].startswith("source:")
              for passage in source["passages"]:
                  assert passage["id"].startswith("passage:") and passage["text"].strip()

          print(f"Production AI Search healthy: {len(results)} allowed result(s)")
          PY

      - name: Verify answer route and canonical database access without inference
        if: env.EAE_ANSWER_ENABLED == 'true'
        run: |
          curl --fail-with-body --silent --show-error \
            --header 'Content-Type: application/json' \
            --data '{"query":"Readiness probe","record_ids":["__eae_readiness_probe__"]}' \
            'https://agenticengineering.science/api/search/answer' \
            --output answer-readiness.json
          python - <<'PY'
          import json
          with open("answer-readiness.json", encoding="utf-8") as f:
              data = json.load(f)
          assert data["version"] == 1
          assert data["provenance"] == "canonical_eae_records"
          assert data["answer"]["outcome"] == "insufficient"
          assert data["sources"] == []
          print("Answer route and canonical D1 read healthy; no inference performed")
          PY
