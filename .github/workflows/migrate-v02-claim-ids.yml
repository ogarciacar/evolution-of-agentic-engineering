name: Migrate v0.2 claim identities
on: push
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix-v0-2-claim-numbering
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Renumber active v0.2 claim identities
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          excluded = {
              Path('model/history/v0.1-claims.yaml'),
              Path('.github/workflows/migrate-v02-claim-ids.yml'),
          }
          text_suffixes = {'.yaml', '.yml', '.json', '.md', '.py', '.js', '.html', '.sql'}
          changed = []
          for p in root.rglob('*'):
              if not p.is_file() or p in excluded or '.git' in p.parts or p.suffix not in text_suffixes:
                  continue
              s = p.read_text()
              if not any(x in s for x in ('C03', 'C04', 'C05')):
                  continue
              s2 = s.replace('C03', '__CLAIM_SELECTION__')
              s2 = s2.replace('C04', '__CLAIM_COOPERATION__')
              s2 = s2.replace('C05', '__CLAIM_SPECIALIZATION__')
              s2 = s2.replace('__CLAIM_SELECTION__', 'C02')
              s2 = s2.replace('__CLAIM_COOPERATION__', 'C03')
              s2 = s2.replace('__CLAIM_SPECIALIZATION__', 'C04')
              if s2 != s:
                  p.write_text(s2)
                  changed.append(str(p))
          print('\n'.join(changed))
          PY
          python scripts/validate-model-claims.py
          python scripts/validate-research-gaps.py
          python scripts/validate-evidence-claims.py
          python scripts/check-model-evaluation.py
          python scripts/build-model-evaluation.py
          python scripts/build-evidence.py
          python scripts/build-homepage-evidence.py
          git rm .github/workflows/migrate-v02-claim-ids.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Renumber active v0.2 claims sequentially"
          git push origin HEAD:fix-v0-2-claim-numbering
