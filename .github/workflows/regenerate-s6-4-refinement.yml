name: Regenerate S6.4 refinement

on:
  push:
    branches:
      - s6-4-research-record-evidence-queue
    paths:
      - .github/workflows/regenerate-s6-4-refinement.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Regenerate evidence artifacts
        run: python scripts/build-evidence.py
      - name: Commit generated artifacts
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Generated artifacts are already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence.html signals sitemap.xml
          git commit -m "build: regenerate refined S6.4 evidence artifacts"
          git push
