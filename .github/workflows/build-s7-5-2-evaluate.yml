name: Generate S7.5.2 evaluation page
on: push
permissions:
  contents: write
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: s7-5-2-surface-research-gaps
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          python scripts/validate-research-gaps.py
          python scripts/check-model-evaluation.py
          python scripts/build-model-evaluation.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/build-model-evaluation.py templates/evaluate.html evaluate.html
          git commit -m "Surface research gaps on model evaluation"
          git push origin HEAD:s7-5-2-surface-research-gaps
