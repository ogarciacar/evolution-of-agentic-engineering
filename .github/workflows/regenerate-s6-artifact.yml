name: Regenerate S6 evidence artifact

on:
  push:
    branches: [s6-1-evidence-query-experience]
    paths:
      - ".github/workflows/regenerate-s6-artifact.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: s6-1-evidence-query-experience
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/build-evidence.py
      - name: Commit generated evidence page
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- evidence.html; then
            echo "evidence.html is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence.html
          git commit -m "build: regenerate evidence page"
          git push origin HEAD:s6-1-evidence-query-experience
