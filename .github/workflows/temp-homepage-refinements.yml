name: Temporary homepage refinements

on:
  push:
    branches: [homepage-refinements-v0-2]

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: homepage-refinements-v0-2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install pyyaml
      - name: Refine homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          def replace(old, new):
              global s
              if old not in s: raise SystemExit(f'Expected homepage fragment not found: {old[:100]}')
              s = s.replace(old, new, 1)
          replace('<strong>A working model by Orlando Garcia</strong>', '<strong>A working model by <a href="https://www.linkedin.com/in/ogarciacar">Orlando Garcia</a></strong>')
          replace('<h2>From agentic actors to higher-order engineering systems</h2>', '<h2>From agents to engineering systems</h2>')
          replace('Those versions supply the population upon which Selection can operate; variation is not a separate stage.', 'Those versions supply the population upon which Selection can operate.')
          replace('<p class="statement">The useful question is not which agent variant will win, but <strong>which engineering conditions allow useful configurations to operate reliably and economically at scale.</strong></p>', '<p class="statement">The useful question is <strong>which engineering conditions allow useful agent variants to operate reliably and economically at scale.</strong></p>')
          replace('<div class="formula"><span>Agentic-system fitness</span> = useful outcome / ( context + execution + coordination + verification + human attention + compute )</div>', '<div class="formula"><span>Agentic-system fitness</span> = useful outcome / ( context + execution + verification + coordination + observability + economics + learning )</div>')
          replace("This model was developed using Daniel San Martín's Clarity model as a thinking lens, particularly its progression through Apparition, Selection, Cooperation and Specialization.", 'This model was developed using <a href="https://www.linkedin.com/in/danielsanmartinsepuveda/">Daniel San Martín\'s</a> <a href="https://www.goodreads.com/book/show/58961062-clarity">Clarity</a> model as a thinking lens, particularly its progression through Apparition, Selection, Cooperation and Specialization.')
          hypothesis = '<div class="hypothesis">Working hypothesis: <b>agentic engineering may be entering Selection.</b></div>'
          scale = '<div class="scale-axis"><div class="scale-end"><span>INDIVIDUAL AGENT</span><strong>1 agent</strong><small>capability matters</small></div><div class="scale-line"><i>→</i></div><div class="scale-end scale-right"><span>AGENT POPULATION</span><strong>1K agents</strong><small>environment matters</small></div></div>'
          replace(hypothesis, scale + hypothesis)
          old_forcing = '<p class="lead">1K agents is not a utilization target or industry benchmark. It is a stress test: small inefficiencies in context, execution, verification, coordination, observability, economics and learning become systemic when multiplied across an agent population.</p><div class="formula"><span>1K-agent scale</span> = amplify( friction + ambiguity + risk + coordination + cost )</div>'
          new_forcing = '<div class="forcing-grid"><div><p class="lead">1K agents is not a utilization target or industry benchmark. It is a stress test: small inefficiencies become systemic when multiplied across an agent population.</p></div><div class="breaks"><p><strong>Expensive context exploration × 1K</strong><em>becomes systemic waste</em></p><p><strong>Non-reproducible execution × 1K</strong><em>becomes operational instability</em></p><p><strong>Human-dependent verification × 1K</strong><em>becomes a throughput ceiling</em></p><p><strong>Coordination conflicts × 1K</strong><em>can erase the benefit of parallelism</em></p><p><strong>Opaque agent behavior × 1K</strong><em>makes failures and exceptions impossible to understand</em></p><p><strong>Unbounded execution cost × 1K</strong><em>turns small inefficiencies into unsustainable economics</em></p><p><strong>Repeated failures × 1K</strong><em>compound unless every execution improves the system</em></p></div></div>'
          replace(old_forcing, new_forcing)
          origins = '<section><div class="eyebrow">Origins</div><h2>Thinking lens</h2>'
          try_model = '<section><div class="eyebrow">Try the model</div><h2>Where does this fit?</h2><p class="lead">Found something about agentic engineering? Give it to your AI agent and test it against the model.</p><div class="formula try-prompt"><span>Where does this fit?</span><br>[ARTICLE URL]<br>Use agenticengineering.science.</div><div class="links"><a href="apply.html">See how evidence is evaluated →</a></div></section>\n'
          replace(origins, try_model + origins)
          css_anchor = 'footer{padding-top:36px;color:var(--muted);font-size:13px}'
          css = '.scale-axis{display:grid;grid-template-columns:180px 1fr 180px;gap:20px;align-items:center;margin-top:34px}.scale-end{display:grid;gap:4px}.scale-end span{font-size:10px;font-weight:850;letter-spacing:.14em;color:var(--muted)}.scale-end strong{font-size:16px}.scale-end small{color:var(--muted)}.scale-right{text-align:right}.scale-line{height:1px;background:var(--line);position:relative}.scale-line i{position:absolute;right:-2px;top:-13px;font-style:normal;color:var(--accent);font-size:20px}.forcing-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:64px;align-items:start;margin-top:32px}.breaks{display:grid;gap:0}.breaks p{margin:0;padding:13px 0;border-bottom:1px solid var(--line)}.breaks strong,.breaks em{display:block}.breaks em{color:var(--muted);font-style:italic;margin-top:2px}.try-prompt{font-size:16px}.try-prompt span{font-size:18px}' + css_anchor
          replace(css_anchor, css)
          replace('@media(max-width:900px){.evolution{grid-template-columns:1fr}', '@media(max-width:900px){.scale-axis{grid-template-columns:1fr}.scale-line{display:none}.scale-right{text-align:left}.forcing-grid{grid-template-columns:1fr;gap:24px}.evolution{grid-template-columns:1fr}')
          p.write_text(s)
          PY
          python scripts/build-homepage-evidence.py
      - name: Commit refined homepage
        run: |
          rm .github/workflows/temp-homepage-refinements.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/temp-homepage-refinements.yml
          git commit -m "Refine v0.2 public homepage"
          git push origin HEAD:homepage-refinements-v0-2
