name: Verify production evidence API

on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - ".github/workflows/verify-production-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production evidence API
        shell: bash
        run: |
          set -uo pipefail
          URL="https://agenticengineering.science/api/evidence"
          MAX_ATTEMPTS=30
          INTERVAL_SECONDS=10

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            STATUS=$(curl --silent --show-error \
              -H 'Accept: application/json' \
              --output response.json \
              --write-out '%{http_code}' \
              "$URL" || true)

            if [ "$STATUS" = "200" ] && python - <<'PY'
          import json
          with open("response.json", encoding="utf-8") as f:
              data = json.load(f)
          assert isinstance(data.get("evidence"), list)
          assert data.get("count") == len(data["evidence"])
          PY
            then
              COUNT=$(python -c 'import json; print(json.load(open("response.json"))["count"])')
              echo "Production API returned $COUNT evidence records"
              exit 0
            fi

            echo "Attempt $attempt/$MAX_ATTEMPTS: production API not ready (HTTP $STATUS)"
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              sleep "$INTERVAL_SECONDS"
            fi
          done

          echo "Production evidence API did not become ready within 5 minutes"
          echo "Final HTTP status: $STATUS"
          echo "Final response body:"
          head -c 1000 response.json || true
          echo
          exit 1
