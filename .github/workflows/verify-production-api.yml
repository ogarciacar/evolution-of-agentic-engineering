name: Verify production evidence API

on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - ".github/workflows/verify-production-api.yml"
  workflow_dispatch:

permissions:
  contents: read
  checks: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          MAX_ATTEMPTS=30
          INTERVAL_SECONDS=10

          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            CHECK=$(gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
              --jq '[.check_runs[] | select(.name == "Cloudflare Pages")][0] | if . == null then "missing" else (.status + ":" + (.conclusion // "")) end')

            case "$CHECK" in
              completed:success)
                echo "Cloudflare Pages deployed commit ${GITHUB_SHA} successfully"
                exit 0
                ;;
              completed:*)
                echo "Cloudflare Pages deployment failed for ${GITHUB_SHA}: $CHECK"
                exit 1
                ;;
              *)
                echo "Attempt $attempt/$MAX_ATTEMPTS: Cloudflare Pages check is $CHECK"
                ;;
            esac

            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              sleep "$INTERVAL_SECONDS"
            fi
          done

          echo "Cloudflare Pages did not complete within 5 minutes for ${GITHUB_SHA}"
          exit 1

      - name: Verify deployed production evidence API
        env:
          HEALTHCHECK_TOKEN: ${{ secrets.PRODUCTION_API_HEALTHCHECK_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          curl --fail-with-body \
            --silent \
            --show-error \
            --header 'Accept: application/json' \
            --header "X-Agentic-Healthcheck: $HEALTHCHECK_TOKEN" \
            https://agenticengineering.science/api/evidence \
            --output response.json

          python - <<'PY'
          import json

          with open("response.json", encoding="utf-8") as f:
              data = json.load(f)

          assert isinstance(data.get("evidence"), list)
          assert data.get("count") == len(data["evidence"])
          print(f'Production API healthy after deployment: {data["count"]} evidence records')
          PY
