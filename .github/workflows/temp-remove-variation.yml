name: Temporary remove variation panel
on:
  push:
    branches: [homepage-refinements-v0-2]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: homepage-refinements-v0-2
      - name: Remove variation panel
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '<div class="variation"><b>VARIATION / MUTATION · MECHANISM</b><span>Once the object appears, configurations vary. Those versions supply the population upon which Selection can operate.</span></div>'
          if old not in s:
              raise SystemExit('Variation panel not found')
          p.write_text(s.replace(old, '', 1))
          PY
      - name: Commit change and remove temporary workflow
        run: |
          rm .github/workflows/temp-remove-variation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/temp-remove-variation.yml
          git commit -m "Remove variation mechanism panel from homepage"
          git push origin HEAD:homepage-refinements-v0-2
