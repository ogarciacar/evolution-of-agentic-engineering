name: Preview smoke

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - "evidence/**"
      - "schema/**"
      - "migrations/**"
      - "functions/**"
      - "index.html"
      - "evidence.html"
      - "evaluate.html"
      - "pipeline/projection/**"
      - "pipeline/preview/**"
      - ".github/workflows/preview-smoke.yml"

concurrency:
  group: preview-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT: evolution-of-agentic-engineering
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PREVIEW_SMOKE_TIMEOUT_SECONDS: "600"

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify deployed preview
        run: python pipeline/preview/run_preview_smoke.py
