name: Sync evidence to D1

on:
  push:
    branches: [main]
    paths:
      - "evidence/**"
      - "schema/**"
      - "migrations/**"
      - "scripts/export-evidence-sql.py"
      - ".github/workflows/sync-evidence-d1.yml"
  workflow_dispatch:

concurrency:
  group: evidence-d1-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      EVIDENCE_DB_NAME: ${{ vars.EVIDENCE_DB_NAME }}
      EVIDENCE_DB_ID: ${{ vars.EVIDENCE_DB_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Require production D1 configuration
        run: |
          test -n "$EVIDENCE_DB_NAME" || { echo "Missing production environment variable EVIDENCE_DB_NAME"; exit 1; }
          test -n "$EVIDENCE_DB_ID" || { echo "Missing production environment variable EVIDENCE_DB_ID"; exit 1; }
      - name: Build ephemeral Wrangler D1 configuration
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          config = {
              "name": "agentic-engineering-evidence-ci",
              "compatibility_date": "2026-09-05",
              "d1_databases": [{
                  "binding": "EVIDENCE_DB",
                  "database_name": os.environ["EVIDENCE_DB_NAME"],
                  "database_id": os.environ["EVIDENCE_DB_ID"],
                  "migrations_dir": "migrations",
              }],
          }
          with open("wrangler-d1.json", "w", encoding="utf-8") as f:
              json.dump(config, f)
          PY
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Validate evidence records
        run: python scripts/validate-evidence.py
      - name: Export deterministic synchronization SQL
        run: python scripts/export-evidence-sql.py --output .artifacts/evidence-sync.sql
      - name: Apply D1 migrations
        run: npx --yes wrangler@4 d1 migrations apply EVIDENCE_DB --remote --config wrangler-d1.json
      - name: Synchronize canonical evidence
        run: npx --yes wrangler@4 d1 execute EVIDENCE_DB --remote --yes --config wrangler-d1.json --file=.artifacts/evidence-sync.sql
      - name: Verify remote evidence count
        run: |
          EXPECTED=$(find evidence -maxdepth 1 -name '*.yaml' -type f | wc -l | tr -d ' ')
          OUTPUT=$(npx --yes wrangler@4 d1 execute EVIDENCE_DB --remote --json --config wrangler-d1.json --command='SELECT COUNT(*) AS count FROM evidence;')
          ACTUAL=$(python -c 'import json,sys; data=json.load(sys.stdin); print(data[0]["results"][0]["count"])' <<< "$OUTPUT")
          test "$ACTUAL" = "$EXPECTED" || { echo "Remote evidence count $ACTUAL != canonical count $EXPECTED"; exit 1; }
          echo "Production D1 contains $ACTUAL canonical evidence records"
