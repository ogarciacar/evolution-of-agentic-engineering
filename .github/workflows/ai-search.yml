name: AI Search contracts

on:
  pull_request:
    paths:
      - "workers/ai-search/**"
      - "experiments/ai-search/**"
      - "evidence/**"
      - "evidence-search.js"
      - "evidence-search.css"
      - "evidence.html"
      - "pipeline/build/build-evidence.py"
      - "pipeline/templates/sitemap.xml"
      - "docs/ai-search.md"
      - "docs/README.md"
      - ".github/workflows/ai-search.yml"
      - ".github/workflows/ai-search-production.yml"
  push:
    branches: [main]
    paths:
      - "workers/ai-search/**"
      - "experiments/ai-search/**"
      - "evidence/**"
      - "evidence-search.js"
      - "evidence-search.css"
      - "evidence.html"
      - "pipeline/build/build-evidence.py"
      - "pipeline/templates/sitemap.xml"
      - "docs/ai-search.md"
      - "docs/README.md"
      - ".github/workflows/ai-search.yml"
      - ".github/workflows/ai-search-production.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install publication dependencies
        run: pip install -r pipeline/requirements.txt
      - name: Generate sitemap from canonical evidence
        run: python pipeline/build/build-evidence.py
      - name: Check AI Search endpoint contract
        run: node workers/ai-search/check-search-endpoint.mjs
      - name: Check Ask the evidence UI contract
        run: node workers/ai-search/check-search-ui.mjs
      - name: Check AI Search corpus sitemap coverage
        run: node experiments/ai-search/check-corpus-coverage.mjs
      - name: Check evaluation tooling syntax
        run: |
          node --check experiments/ai-search/evaluate.mjs
          node --check experiments/ai-search/evaluate-precision.mjs
          node -e 'JSON.parse(require("node:fs").readFileSync("experiments/ai-search/evaluation-queries.json", "utf8"))'
          node -e 'JSON.parse(require("node:fs").readFileSync("experiments/ai-search/precision-judgments.json", "utf8"))'
