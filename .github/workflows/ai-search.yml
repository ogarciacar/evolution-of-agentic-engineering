name: AI Search experiment

on:
  pull_request:
    paths:
      - "workers/ai-search/**"
      - "experiments/ai-search/**"
      - "evidence-search.js"
      - "evidence-search.css"
      - "evidence.html"
      - "sitemap.xml"
      - "docs/ai-search-experiment.md"
      - "docs/README.md"
      - ".github/workflows/ai-search.yml"
  push:
    branches: [main]
    paths:
      - "workers/ai-search/**"
      - "experiments/ai-search/**"
      - "evidence-search.js"
      - "evidence-search.css"
      - "evidence.html"
      - "sitemap.xml"
      - "docs/ai-search-experiment.md"
      - "docs/README.md"
      - ".github/workflows/ai-search.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Check AI Search endpoint contract
        run: node workers/ai-search/check-search-endpoint.mjs
      - name: Check Ask the evidence UI contract
        run: node workers/ai-search/check-search-ui.mjs
      - name: Check AI Search corpus sitemap coverage
        run: node experiments/ai-search/check-corpus-coverage.mjs
      - name: Run production retrieval reliability characterization
        run: node experiments/ai-search/evaluate.mjs --attempts 3 --slow-ms 7000 --output .artifacts/ai-search-reliability.md
      - name: Show retrieval reliability characterization
        run: cat .artifacts/ai-search-reliability.md
      - name: Run production retrieval precision benchmark
        run: node experiments/ai-search/evaluate-precision.mjs --attempts 3 --output .artifacts/ai-search-precision.md
      - name: Show retrieval precision benchmark
        run: cat .artifacts/ai-search-precision.md
      - name: Upload retrieval evaluation reports
        uses: actions/upload-artifact@v4
        with:
          name: ai-search-reliability-report
          path: |
            .artifacts/ai-search-reliability.md
            .artifacts/ai-search-precision.md
          if-no-files-found: error
