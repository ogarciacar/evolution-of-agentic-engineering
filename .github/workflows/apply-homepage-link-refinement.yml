name: Apply homepage link refinement
on: push
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: homepage-refinements-v0-2
      - name: Refine homepage links
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          # Remove Apply the model from Evidence landscape links, wherever it sits beside evidence navigation.
          s = s.replace('<a href="apply.html">Apply the model →</a>', '')
          # In Try the model, rename the remaining apply.html CTA to Apply the model.
          s = s.replace('<a href="apply.html">See how evidence is evaluated →</a>', '<a href="apply.html">Apply the model →</a>')
          s = s.replace('<a href="apply.html">See how evidence is evaluated</a>', '<a href="apply.html">Apply the model →</a>')
          p.write_text(s)
          PY
          git rm .github/workflows/apply-homepage-link-refinement.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Refine homepage model links"
          git push origin HEAD:homepage-refinements-v0-2