version: 2

claims:
  - id: C01
    stage: Apparition
    title: Agentic engineering actors have appeared
    claim: >-
      Models, context, tools, execution, permissions, and feedback can combine into
      agentic engineering actors capable of meaningful software-engineering action.
      Once such objects appear, variation can arise among their configurations.
    challenged_by: >-
      Evidence that these combinations remain only interactive tools dependent on
      continuous human operation and cannot act as meaningful engineering objects.

  - id: C03
    stage: Selection
    title: Engineering environments select among viable variants
    claim: >-
      Variation among viable agentic engineering objects encounters engineering
      environments that materially affect which configurations can operate reliably,
      economically, and persist at increasing scale.
    challenged_by: >-
      Evidence that materially different agentic configurations remain equally viable
      regardless of context, execution, verification, coordination, observability,
      economics, and learning conditions in their engineering environment.

  - id: C04
    stage: Cooperation
    title: Cooperation can improve agentic engineering fitness
    claim: >-
      Cooperation among agentic engineering objects, humans, and systems can increase
      their ability to succeed or persist in engineering work compared with useful
      isolated operation.
    challenged_by: >-
      Evidence that cooperation provides no durable fitness or persistence advantage,
      or that isolated agentic engineering objects remain systematically more effective
      as engineering demands increase.

  - id: C05
    stage: Specialization
    title: Persistent cooperation can produce higher-order engineering objects
    claim: >-
      Persistent cooperation can produce differentiated, integrated agentic engineering
      capabilities such that the cooperating system itself becomes a meaningful
      higher-order engineering object.
    challenged_by: >-
      Evidence that persistent cooperation does not produce durable differentiation or
      integration, or that cooperating specialized parts never form a meaningful
      higher-order engineering capability.
